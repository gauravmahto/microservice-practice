apiVersion: apps/v1
kind: Deployment
metadata:
  # Use a helper template to generate the full release name
  name: {{ include "practice-chart.fullname" . }}
  labels:
    {{- include "practice-chart.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # Get the number of replicas from values.yaml
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      # Use a helper template for labels
      {{- include "practice-chart.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "practice-chart.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Use the service account name defined in values.yaml
      serviceAccountName: {{ include "practice-chart.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # 1. Define the shared volume for config generated by the initContainer
      volumes:
        - name: config-volume
          emptyDir: {}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}

      # 2. Init container to generate config using Ansible
      initContainers:
        - name: ansible-config-generator
          image: "{{ .Values.configGenerator.image.repository }}:{{ .Values.configGenerator.image.tag }}"
          imagePullPolicy: {{ .Values.configGenerator.image.pullPolicy | default "IfNotPresent" }}
          command: ["ansible-playbook", "playbooks/generate_config.yml"]
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
          env:
            - name: APP_GREETING
              value: {{ .Values.applicationConfig.greeting | quote }}
            - name: FEATURE_FLAG_DASHBOARD
              value: {{ .Values.applicationConfig.features.dashboard | quote }}
            - name: FEATURE_FLAG_APIV2
              value: {{ .Values.applicationConfig.features.apiV2 | quote }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Build the image name and tag from values.yaml
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              # Use the port from the service values
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- /* Ensure config-volume is mounted and merge with user provided mounts */}}
          {{- if not .Values.volumeMounts }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
          {{- else }}
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
              readOnly: true
            {{- toYaml .Values.volumeMounts | nindent 12 }}
          {{- end }}
      {{- /* user volumes are already appended above in the single volumes list */}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
