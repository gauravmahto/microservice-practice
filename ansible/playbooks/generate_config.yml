---
- name: Generate Application Configuration
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Ensure config directory exists
      ansible.builtin.file:
        path: /app/config
        state: directory
        mode: '0755'

    - name: Template the config.json file from environment variables
      ansible.builtin.template:
        src: /ansible/templates/config.json.j2
        dest: /app/config/config.json
        mode: '0644'
